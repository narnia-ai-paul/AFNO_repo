[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "afno-burgers-ks"
version = "0.1.0"
description = "Autoregression-free neural operators with reproducible Burgers and KS examples"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "numpy>=1.24", "scipy>=1.10", "matplotlib>=3.9", "filelock>=3.12"]

[project.scripts]
afno = "afno.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
afno = ["assets/configs/*.json", "assets/pretrained/*.pt", "assets/examples/*.npz", "assets/*.json"]
